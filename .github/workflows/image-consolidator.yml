name: Smart Image Consolidator

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  image-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24

      - name: Set PR Environment Variables
        run: |
          echo "GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

      # Install Docker CLI + daemon (v20.10.23)
      - name: Set up Docker
        uses: docker/setup-docker@v3
        with:
          version: '20.10.23'

      - name: Set up Buildx (optional)
        uses: docker/setup-buildx-action@v2

      - name: Install Go Dependencies
        run: go mod tidy

      - name: Build and Run Smart Image Consolidator
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          go build -o consolidator main.go
          ./consolidator
